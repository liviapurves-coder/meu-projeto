<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineExplorer - Seu Guia de Filmes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header>
    <div class="logo">
      <i class="fas fa-film"></i> CineExplorer
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pesquisar por título...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <nav>
      <button id="showTrendingBtn" class="active"><i class="fas fa-fire"></i> Em Alta</button>
      <button id="showFavoritesBtn"><i class="fas fa-heart"></i> Favoritos (<span id="favCount">0</span>)</button>
    </nav>
  </header>

  <section class="genre-container">
    <button class="genre-btn active" data-genre="todos">Todos</button>
    <button class="genre-btn" data-genre="Ação">Ação</button>
    <button class="genre-btn" data-genre="Ficção Científica">Ficção Científica</button>
    <button class="genre-btn" data-genre="Drama">Drama</button>
    <button class="genre-btn" data-genre="Animação">Animação</button>
  </section>

  <main>
    <h2 id="sectionTitle">Filmes em Alta</h2>
    <div id="moviesGrid" class="movies-grid">
      </div>
  </main>

  <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div id="modalBody">
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
